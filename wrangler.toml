name = "sipwise"
pages_build_output_dir = "public"
compatibility_date = "2024-11-01"

# D1 database binding. After `wrangler d1 create sipwise`, paste the printed
# database_id below (and set the same binding in the Cloudflare Pages dashboard:
# Settings → Functions → D1 database bindings → Variable name DB).
[[d1_databases]]
binding = "DB"
database_name = "sipwise"
database_id = "REPLACE_WITH_YOUR_D1_ID"
